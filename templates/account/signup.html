{% extends 'task/base.html' %}

{% block title %}Sign Up – Hangarin{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div style="background:#FFFFFF; border-radius:20px; padding:3rem; width:100%; max-width:460px; box-shadow:0 12px 30px rgba(22, 78, 99, 0.1); border:1px solid #CCFBF1;">
        <div style="text-align:center; margin-bottom:2rem;">
            <h2 style="margin:0; font-size:1.6rem; font-weight:800; color:#164E63; letter-spacing:-0.02em;">Create a Hangarin Account</h2>
        </div>

        <form method="post" action="{% url 'account_signup' %}">
            {% csrf_token %}
            {% for field in form %}
            <div style="margin-bottom:1.25rem;">
                <label for="{{ field.id_for_label }}" style="display:block; margin-bottom:0.45rem; font-weight:700; font-size:0.88rem; color:#164E63;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color:#ef4444; font-size:0.8rem; margin-top:0.25rem;">
                    {{ field.errors.0 }}
                </div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-teal" style="width:100%; text-align:center; font-size:1rem; padding:0.85rem; border-radius:10px; font-weight:700; margin-top:1rem;">Create Account</button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#475569;">
            Already have an account? <a href="{% url 'account_login' %}" style="color:#0F766E; font-weight:700; text-decoration:none;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
