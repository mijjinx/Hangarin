{% extends 'task/base.html' %}

{% block title %}Login – Hangarin{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div style="background:#FFFFFF; border-radius:20px; padding:3rem; width:100%; max-width:400px; box-shadow:0 12px 30px rgba(22, 78, 99, 0.1); border:1px solid #CCFBF1;">
        <div style="text-align:center; margin-bottom:2.25rem;">
            <h2 style="margin:0; font-size:1.6rem; font-weight:800; color:#164E63; letter-spacing:-0.02em;">Log in to Hangarin</h2>
        </div>

        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div style="color:#ef4444; margin-bottom:1.25rem; font-size:0.85rem; text-align:center; font-weight:600;">
                {{ form.non_field_errors.0 }}
            </div>
            {% endif %}

            <div style="margin-bottom:1.25rem;">
                <label for="id_username" style="display:block; margin-bottom:0.45rem; font-weight:700; font-size:0.88rem; color:#164E63;">Username</label>
                <input type="text" name="username" id="id_username" class="form-input" required autofocus placeholder="Enter your username">
            </div>

            <div style="margin-bottom:1.75rem;">
                <label for="id_password" style="display:block; margin-bottom:0.45rem; font-weight:700; font-size:0.88rem; color:#164E63;">Password</label>
                <input type="password" name="password" id="id_password" class="form-input" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-teal" style="width:100%; text-align:center; font-size:1rem; padding:0.85rem; border-radius:10px; font-weight:700;">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
