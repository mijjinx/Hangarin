{% extends 'task/base.html' %}

{% block title %}Notes – Hangarin{% endblock %}

{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <h1 style="margin:0; font-size:2rem; font-weight:800; color:#164E63; letter-spacing:-0.02em;">Notes</h1>
    <a href="{% url 'note_create' %}" class="btn-teal">+ Add Note</a>
</div>

<div class="grid-cards">
    {% for note in notes %}
    <div class="content-card">
        <div>
            <p style="margin:0 0 0.75rem 0; font-size:1rem; line-height:1.5; color:#FFFFFF;">{{ note.content }}</p>
            <small style="color:#A5F3FC; display:block; font-weight:500;">Task: <strong style="color:#FFFFFF;">{{ note.task.title }}</strong></small>
        </div>

        <div style="display:flex; gap:0.5rem; border-top:1px solid rgba(255,255,255,0.15); padding-top:0.85rem; margin-top:1.25rem;">
            <a href="{% url 'note_update' note.pk %}" style="background:#0284C7; color:#FFFFFF; padding:0.4rem 0.85rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:700;">Edit</a>
            <a href="{% url 'note_delete' note.pk %}" style="background:#E11D48; color:#FFFFFF; padding:0.4rem 0.85rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:700;">Delete</a>
        </div>
    </div>
    {% empty %}
    <p style="color:#164E63;">No notes found.</p>
    {% endfor %}
</div>
{% endblock %}
