{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% progressive_web_app_meta %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hangarin – Task Manager{% endblock %}</title>
    <style>
        :root {
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
            --sidebar-active: #6366f1;
            --sidebar-active-text: #ffffff;
            --main-bg: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --border-light: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--main-bg);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        .layout-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            padding: 2rem 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            border-right: 1px solid var(--border-light);
        }

        .brand-container {
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background: var(--sidebar-active);
            color: var(--sidebar-active-text);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .admin-link {
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .admin-link:hover {
            color: #ffffff;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .main-content {
            flex-grow: 1;
            padding: 2.5rem;
            background: var(--main-bg);
            overflow-y: auto;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .content-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="layout-container">
        {% if user.is_authenticated %}
        <aside class="sidebar">
            <div>
                <div class="brand-container">
                    <a href="{% url 'home' %}" class="brand-logo">
                        Hangarin
                    </a>
                </div>

                <nav class="sidebar-menu">
                    <a href="{% url 'home' %}" class="nav-item {% if active_tab == 'home' %}active{% endif %}">
                        <span>⌂</span> Home
                    </a>
                    <a href="{% url 'task_list' %}" class="nav-item {% if active_tab == 'tasks' %}active{% endif %}">
                        <span>✓</span> Tasks
                    </a>
                    <a href="{% url 'subtask_list' %}" class="nav-item {% if active_tab == 'subtasks' %}active{% endif %}">
                        <span>↳</span> Subtasks
                    </a>
                    <a href="{% url 'note_list' %}" class="nav-item {% if active_tab == 'notes' %}active{% endif %}">
                        <span>✏</span> Notes
                    </a>
                    <a href="{% url 'category_list' %}" class="nav-item {% if active_tab == 'categories' %}active{% endif %}">
                        <span>▤</span> Categories
                    </a>
                    <a href="{% url 'priority_list' %}" class="nav-item {% if active_tab == 'priorities' %}active{% endif %}">
                        <span>◆</span> Priorities
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a href="/admin/" class="admin-link">Manage in admin →</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Log out ({{ user.username }})</button>
                </form>
            </div>
        </aside>
        {% endif %}

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
