{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% progressive_web_app_meta %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hangarin – Task Manager{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #164E63;
            --navy-dark: #0E3847;
            --teal: #0F766E;
            --teal-hover: #0d655e;
            --white: #FFFFFF;
            --light-blue: #ECFEFF;
            --text-dark: #0F2942;
            --text-muted: #475569;
            --border-light: #CFFAFE;
            --card-bg: #164E63;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            background: var(--light-blue);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        .layout-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #164E63 0%, #0E3847 100%);
            padding: 2rem 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand-container {
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--white);
            text-decoration: none;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 9999px;
            color: #A5F3FC;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: var(--teal);
            color: var(--white);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .admin-link {
            color: #A5F3FC;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }

        .admin-link:hover {
            color: var(--white);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ECFEFF;
            padding: 0.55rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--white);
        }

        .main-content {
            flex-grow: 1;
            padding: 2.5rem;
            background: var(--light-blue);
            overflow-y: auto;
        }

        .btn-teal {
            background: var(--teal);
            color: var(--white);
            padding: 0.65rem 1.4rem;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-teal:hover {
            background: var(--teal-hover);
        }

        .btn-outline-white {
            background: transparent;
            border: 1.5px solid var(--white);
            color: var(--white);
            padding: 0.65rem 1.4rem;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
        }

        .btn-outline-white:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .content-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(22, 78, 99, 0.15);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #99F6E4;
            background: var(--white);
            color: var(--navy);
            font-size: 0.95rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
        }
    </style>
</head>
<body>
    <div class="layout-container">
        {% if user.is_authenticated %}
        <aside class="sidebar">
            <div>
                <div class="brand-container">
                    <a href="{% url 'home' %}" class="brand-logo">
                        Hangarin
                    </a>
                </div>

                <nav class="sidebar-menu">
                    <a href="{% url 'home' %}" class="nav-item {% if active_tab == 'home' %}active{% endif %}">
                        <span>⌂</span> Home
                    </a>
                    <a href="{% url 'task_list' %}" class="nav-item {% if active_tab == 'tasks' %}active{% endif %}">
                        <span>✓</span> Tasks
                    </a>
                    <a href="{% url 'subtask_list' %}" class="nav-item {% if active_tab == 'subtasks' %}active{% endif %}">
                        <span>↳</span> Subtasks
                    </a>
                    <a href="{% url 'note_list' %}" class="nav-item {% if active_tab == 'notes' %}active{% endif %}">
                        <span>✏</span> Notes
                    </a>
                    <a href="{% url 'category_list' %}" class="nav-item {% if active_tab == 'categories' %}active{% endif %}">
                        <span>▤</span> Categories
                    </a>
                    <a href="{% url 'priority_list' %}" class="nav-item {% if active_tab == 'priorities' %}active{% endif %}">
                        <span>◆</span> Priorities
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <button id="pwaInstallBtn" class="logout-btn" style="display:none; background:#0F766E; border-color:#0F766E; color:#FFFFFF; margin-bottom:0.5rem; text-align:center;">
                    📲 Install App
                </button>
                <a href="/admin/" class="admin-link">Manage in admin →</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Log out ({{ user.username }})</button>
                </form>
            </div>
        </aside>
        {% endif %}

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('pwaInstallBtn');

        // Register service worker if supported
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/serviceworker.js')
                .then(reg => console.log('SW Registered:', reg.scope))
                .catch(err => console.error('SW Reg Error:', err));
        }

        // Listen for beforeinstallprompt event for native PWA installation
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) {
                installBtn.style.display = 'block';
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to prompt: ${outcome}`);
                deferredPrompt = null;
                installBtn.style.display = 'none';
            });
        }

        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            if (installBtn) installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
