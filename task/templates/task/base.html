{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% progressive_web_app_meta %}
    <meta charset="UTF-8">
    <title>{% block title %}Hangarin{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: #1e293b;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }
        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .btn-create {
            background: var(--accent);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
        }
        .btn-create:hover {
            background: var(--accent-hover);
        }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-logout:hover {
            color: #fff;
            border-color: var(--text-muted);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge {font-size:.75rem; font-weight:600; padding:.25rem .6rem; border-radius:9999px; margin-right:.5rem;}
        .badge-priority {background:#ef4444; color:#fff;}
        .badge-category {background:#3b82f6; color:#fff;}
        .badge-status   {background:#10b981; color:#fff;}
        .card-actions {
            margin-top: 1.25rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
        }
        .action-link {
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
        }
        .action-edit {
            background: #3b82f6;
            color: #fff;
        }
        .action-delete {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <a href="{% url 'task_list' %}" class="navbar-brand">Hangarin</a>
        <div class="nav-links">
            <a href="{% url 'task_list' %}" class="nav-link">Tasks</a>
            <a href="{% url 'subtask_list' %}" class="nav-link">Subtasks</a>
            <a href="{% url 'category_list' %}" class="nav-link">Categories</a>
            <a href="{% url 'priority_list' %}" class="nav-link">Priorities</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn-logout">Logout ({{ user.username }})</button>
            </form>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
