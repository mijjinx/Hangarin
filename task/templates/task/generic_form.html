{% extends 'task/base.html' %}

{% block title %}{{ title }} – Hangarin{% endblock %}

{% block content %}
<style>
    .form-container {
        display: flex;
        justify-content: center;
        margin-top: 2rem;
    }
    .form-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,.2);
    }
    .form-card h2 {
        margin-top: 0;
        color: var(--text-main);
    }
    .form-group {
        margin-bottom: 1.25rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    .form-control {
        width: 100%;
        padding: 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #0f172a;
        color: #fff;
        box-sizing: border-box;
        font-size: 0.95rem;
    }
    .form-control:focus {
        outline: none;
        border-color: var(--accent);
    }
    .btn-group {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
    }
    .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }
    .btn-primary {
        background: var(--accent);
        color: #fff;
    }
    .btn-primary:hover {
        background: var(--accent-hover);
    }
    .btn-secondary {
        background: #475569;
        color: #fff;
    }
</style>

<div class="form-container">
    <div class="form-card">
        <h2>{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color:#ef4444; font-size:0.8rem; margin-top:0.25rem;">
                    {{ field.errors.0 }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url back_url %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
