{% extends 'task/base.html' %}

{% block title %}{{ title }} – Hangarin{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; margin-top:2rem;">
    <div style="background:#FFFFFF; border-radius:16px; padding:2rem; width:100%; max-width:550px; box-shadow:0 4px 16px rgba(15, 118, 110, 0.06); border:1px solid #CCFBF1;">
        <h2 style="margin-top:0; color:#164E63; margin-bottom:1.5rem;">{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div style="margin-bottom:1.25rem;">
                <label for="{{ field.id_for_label }}" style="display:block; margin-bottom:0.4rem; font-weight:600; font-size:0.9rem; color:#164E63;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color:#ef4444; font-size:0.8rem; margin-top:0.25rem;">
                    {{ field.errors.0 }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            <div style="display:flex; gap:1rem; margin-top:2rem;">
                <button type="submit" class="btn-teal">Save</button>
                <a href="{% url back_url %}" style="background:#E2E8F0; color:#475569; padding:0.65rem 1.4rem; border-radius:9999px; text-decoration:none; font-weight:600;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
