{% extends 'task/base.html' %}

{% block title %}Categories – Hangarin{% endblock %}

{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <h1 style="margin:0; font-size:2rem; font-weight:800; color:#164E63; letter-spacing:-0.02em;">Categories</h1>
    <a href="{% url 'category_create' %}" class="btn-teal">+ Add Category</a>
</div>

<div class="grid-cards">
    {% for category in categories %}
    <div class="content-card">
        <div>
            <h3 style="margin:0; font-size:1.2rem; font-weight:700; color:#FFFFFF;">{{ category.name }}</h3>
        </div>

        <div style="display:flex; gap:0.5rem; border-top:1px solid rgba(255,255,255,0.15); padding-top:0.85rem; margin-top:1.25rem;">
            <a href="{% url 'category_update' category.pk %}" style="background:#0284C7; color:#FFFFFF; padding:0.4rem 0.85rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:700;">Edit</a>
            <a href="{% url 'category_delete' category.pk %}" style="background:#E11D48; color:#FFFFFF; padding:0.4rem 0.85rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:700;">Delete</a>
        </div>
    </div>
    {% empty %}
    <p style="color:#164E63;">No categories found.</p>
    {% endfor %}
</div>
{% endblock %}
