{% extends 'task/base.html' %}

{% block title %}Categories – Hangarin{% endblock %}

{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <h1 style="margin:0;">Categories</h1>
    <a href="{% url 'category_create' %}" class="btn-green">+ Add Category</a>
</div>

<div class="grid-cards">
    {% for category in categories %}
    <div class="content-card">
        <div>
            <h3 style="margin:0;">{{ category.name }}</h3>
        </div>

        <div style="display:flex; gap:0.5rem; border-top:1px solid #f1f5f9; padding-top:0.75rem; margin-top:1rem;">
            <a href="{% url 'category_update' category.pk %}" style="background:#e0f2fe; color:#0369a1; padding:0.35rem 0.75rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:600;">Edit</a>
            <a href="{% url 'category_delete' category.pk %}" style="background:#fee2e2; color:#b91c1c; padding:0.35rem 0.75rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:600;">Delete</a>
        </div>
    </div>
    {% empty %}
    <p>No categories found.</p>
    {% endfor %}
</div>
{% endblock %}
